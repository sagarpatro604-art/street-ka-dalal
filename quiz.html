<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investor Persona Test · Street ka Dalal</title>
<meta name="description" content="What kind of investor are you? 16 quick market moves: swipe, tap, spot and guess. Get your investor persona and a Proud Investor certificate from Street ka Dalal. Free, about 4 minutes.">
<meta property="og:title" content="What kind of investor are you? · Street ka Dalal">
<meta property="og:description" content="16 quick market moves, 3 rounds, one persona. Take the test and get your Proud Investor certificate. Free.">
<meta property="og:image" content="https://street-ka-dalal.pages.dev/icons/icon-512.png">
<meta name="theme-color" content="#0b1e14">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,700&family=Great+Vibes&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
:root{--bg:#0b1e14;--bg-2:#10291c;--panel:#143323;--line:rgba(233,220,195,.14);--cream:#e9dcc3;--paper:#fffdf8;--paper-2:#f4eee2;--ink:#1d2a23;--muted:#6c786f;--soft:rgba(233,220,195,.72);
--green:#1f4d3a;--green-2:#2f6b4f;--gold:#b08d57;--gold-2:#d9b878;--gold-3:#f3dca8;--up:#3ecf7e;--up-d:#23794f;--down:#ef6a55;--down-d:#b4442f;
--serif:"Fraunces",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(120% 70% at 80% -10%,#1d4a33 0%,var(--bg-2) 35%,var(--bg) 75%) fixed;color:var(--cream);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(233,220,195,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(233,220,195,.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
a{color:var(--gold-2)}
h1,h2,h3{font-family:var(--serif);margin:0;letter-spacing:-.01em}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font:700 15px var(--sans);cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s;color:inherit}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.gold{background:linear-gradient(135deg,var(--gold-3),var(--gold-2) 45%,var(--gold));color:#12301f;box-shadow:0 8px 26px rgba(217,184,120,.3)}
.btn.green{background:var(--green-2);color:#fff}
.btn.ghost{background:rgba(233,220,195,.08);border:1px solid var(--line);color:var(--cream)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.mono{font-family:var(--mono)}

/* ticker */
.ticker{position:relative;z-index:2;background:#07150d;color:var(--cream);overflow:hidden;white-space:nowrap;font:600 13px var(--mono);height:30px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.ticker-track{display:inline-flex;gap:30px;padding-left:30px;animation:tape 46s linear infinite}
.ticker span{display:inline-flex;gap:6px;align-items:center}
.ticker .up{color:var(--up)}.ticker .down{color:var(--down)}
@keyframes tape{to{transform:translateX(-50%)}}
.top{position:relative;z-index:2}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream);font:700 18px var(--serif);white-space:nowrap}
.brand em{color:var(--gold-2);font-style:italic}
.grow{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(233,220,195,.06);color:var(--cream);display:grid;place-items:center;cursor:pointer}

/* screens */
.screen{animation:screenin .5s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes screenin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* intro */
.hero{padding:26px 0 10px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(217,184,120,.35);background:rgba(217,184,120,.08);border-radius:999px;padding:6px 14px;font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(62,207,126,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(62,207,126,0)}100%{box-shadow:0 0 0 0 rgba(62,207,126,0)}}
.hero h1{font-size:clamp(36px,7vw,62px);line-height:1.02;margin:16px 0 12px;color:#fff}
.hero h1 i{color:var(--gold-2)}
.lede{color:var(--soft);font-size:18px;max-width:560px;margin:0 auto 18px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 22px}
.mode{background:rgba(233,220,195,.05);border:1px solid var(--line);border-radius:16px;padding:12px 8px;font-size:13px;font-weight:600;color:var(--soft);animation:float 4s ease-in-out infinite}
.mode:nth-child(2){animation-delay:.5s}.mode:nth-child(3){animation-delay:1s}.mode:nth-child(4){animation-delay:1.5s}
.mode svg{display:block;margin:0 auto 6px;color:var(--gold-2)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.panel{background:var(--paper);color:var(--ink);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.4);position:relative}
.panel.start{margin-top:96px}
.panel h2{color:var(--green);font-size:24px}
.panel .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
label.f{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
.in{width:100%;border:1px solid #e4dccb;background:#fff;border-radius:12px;padding:13px 14px;font:16px var(--sans);color:var(--ink);margin:0 0 14px;outline:none}
.in:focus{border-color:var(--green-2);box-shadow:0 0 0 3px rgba(47,107,79,.15)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{display:block;text-align:center;border:1px solid #e4dccb;border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px;cursor:pointer;background:#fff;transition:all .15s}
.chips input:checked+label{background:var(--green);border-color:var(--green);color:#fff}
.chips input:focus-visible+label{box-shadow:0 0 0 3px rgba(47,107,79,.25)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid #e4dccb;background:#fff;border-radius:999px;padding:11px 16px;font:700 14px var(--sans);color:var(--ink);cursor:pointer;margin:0 0 14px}
.signed{display:flex;align-items:center;gap:8px;background:#dfe9d6;border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 14px;color:var(--green)}
.err{color:var(--down-d);font-size:14px;font-weight:700;min-height:20px;margin:0 0 8px}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0;text-align:center}
.peek{position:absolute;right:-6px;top:-92px;width:64px;animation:bob 3s ease-in-out infinite;pointer-events:none}
.bubble{position:absolute;right:66px;top:-70px;background:var(--gold-3);color:#12301f;border-radius:14px 14px 4px 14px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.skd-strip{display:flex;align-items:center;gap:14px;margin:22px 0 40px;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:rgba(233,220,195,.04)}
.skd-strip p{margin:0;font-size:14px;color:var(--soft)}
.skd-strip b{color:#fff;display:block;font-size:15px}
.again{background:rgba(217,184,120,.1);border:1px solid rgba(217,184,120,.3);border-radius:16px;padding:12px 14px;margin:0 0 16px;font-size:14px;color:var(--ink);background:#f3ead9}

/* HUD */
.hud{position:sticky;top:0;z-index:5;background:rgba(11,30,20,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0 8px}
.hud-row{display:flex;align-items:center;gap:10px}
.rnd{font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2)}
.qn{font:700 13px var(--mono);color:var(--soft)}
.pf{display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
.pf b{font-size:18px;color:#fff;transition:color .3s}
.pf small{font-size:12px}
.pf b.flash-up{color:var(--up)}.pf b.flash-down{color:var(--down)}
.streak{display:inline-flex;align-items:center;gap:4px;font:700 13px var(--mono);color:var(--gold-2);background:rgba(217,184,120,.12);border-radius:999px;padding:3px 9px}
.streak.hot{animation:hot .6s ease}
@keyframes hot{40%{transform:scale(1.25)}}
.bar{display:flex;gap:3px;margin-top:8px}
.bar i{flex:1;height:5px;border-radius:3px;background:rgba(233,220,195,.12);transition:background .3s}
.bar i.g{background:var(--up)}.bar i.h{background:var(--gold-2)}.bar i.r{background:var(--down)}.bar i.c{background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.spark{display:block;width:84px;height:26px}

/* question */
.stage{padding:18px 0 140px}
.qcard{background:var(--paper);color:var(--ink);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.qtype{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.qcard h2{color:var(--green);font-size:clamp(21px,3.6vw,26px);line-height:1.2;margin:0 0 14px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid #e4dccb;background:#fff;border-radius:16px;padding:14px 16px;font:600 16px var(--sans);color:var(--ink);cursor:pointer;transition:transform .12s,border .12s,background .2s}
.opt:hover{transform:translateX(4px);border-color:var(--green-2)}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--paper-2);font:700 14px var(--mono);color:var(--green)}
.opt.ok{background:#e3f1e6;border-color:var(--up-d)}
.opt.ok b{background:var(--up-d);color:#fff}
.opt.no{background:#fbe5e0;border-color:var(--down-d)}
.opt.no b{background:var(--down-d);color:#fff}
.opts.locked .opt{cursor:default;transform:none}
.chartbox{background:#0f2519;border-radius:16px;padding:10px;margin:0 0 14px}
.chartbox svg{display:block;width:100%;height:240px}
.chartbox .cdl{transform-box:fill-box;transform-origin:50% 100%;animation:grow .4s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes grow{from{transform:scaleY(0)}}
.chartbox.tap .hit{cursor:pointer}
.chartbox.tap .hit:hover rect.hl{opacity:.18}
.chartbox rect.hl{fill:#fff;opacity:0;transition:opacity .15s}
.chartbox .pick rect.hl{opacity:.28;fill:var(--gold-2)}
.chartbox .right rect.hl{opacity:.35;fill:var(--up)}

/* swipe */
.swipe-zone{position:relative;height:250px;margin:0 0 14px;user-select:none;-webkit-user-select:none}
.scard{position:absolute;inset:0;border-radius:20px;background:linear-gradient(160deg,#173a28,#0f2519);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font:700 clamp(19px,3.4vw,23px)/1.35 var(--serif);touch-action:pan-y;cursor:grab;box-shadow:0 14px 30px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,.9,.3,1.1)}
.scard.drag{transition:none;cursor:grabbing}
.stamp{position:absolute;top:18px;font:800 22px var(--sans);letter-spacing:.12em;padding:4px 12px;border-radius:10px;border:3px solid;opacity:0;transform:rotate(-12deg)}
.stamp.bull{left:18px;color:var(--up);border-color:var(--up)}
.stamp.bear{right:18px;color:var(--down);border-color:var(--down);transform:rotate(12deg)}
.swipe-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px;padding:12px;border:2px solid;background:#fff;font:800 16px var(--sans);cursor:pointer;transition:transform .12s}
.sb:hover{transform:translateY(-2px)}
.sb small{font:600 12px var(--sans);color:var(--muted)}
.sb.bear{color:var(--down-d);border-color:#f2c2b8}
.sb.bull{color:var(--up-d);border-color:#b9e0c7}

/* slider */
.slide-val{text-align:center;font:700 64px/1 var(--mono);color:var(--green);margin:6px 0 4px}
.slide-val small{font-size:28px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--down-d),var(--gold-2),var(--up-d));outline:none;margin:14px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--green);box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--green);cursor:grab}
.scale{display:flex;justify-content:space-between;font:600 12px var(--mono);color:var(--muted);margin:0 0 14px}
.truth{position:relative;height:0}
.truth i{position:absolute;top:-34px;transform:translateX(-50%);background:var(--up-d);color:#fff;font:700 12px var(--mono);padding:3px 8px;border-radius:8px;white-space:nowrap;animation:pop .3s both}

/* order */
.slots{display:grid;gap:8px;margin:0 0 12px}
.slot{display:flex;align-items:center;gap:10px;min-height:50px;border:2px dashed #d8cfbd;border-radius:14px;padding:8px 12px;font-weight:600;color:var(--muted)}
.slot b{font:700 14px var(--mono);color:var(--gold);width:22px}
.slot.filled{border-style:solid;border-color:var(--green-2);background:#f3f8f0;color:var(--ink);animation:pop .25s}
.slot.ok{border-color:var(--up-d);background:#e3f1e6}.slot.no{border-color:var(--down-d);background:#fbe5e0}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tok{border:1px solid #e4dccb;background:#fff;border-radius:999px;padding:10px 14px;font:600 14px var(--sans);color:var(--ink);cursor:pointer;transition:transform .12s}
.tok:hover{transform:translateY(-2px);border-color:var(--green-2)}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{border:2px solid #e4dccb;background:#fff;border-radius:14px;padding:11px 12px;font:600 14px/1.3 var(--sans);color:var(--ink);cursor:pointer;text-align:left;transition:all .15s;min-height:54px}
.mi.left{font-weight:800;color:var(--green)}
.mi.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.25)}
.mi.p0{border-color:#2f6b4f;background:#e3f1e6}.mi.p1{border-color:#b08d57;background:#f6ecd8}.mi.p2{border-color:#5b6fb4;background:#e7ebf8}.mi.p3{border-color:#a8577e;background:#f7e6ee}
.mi.no{border-color:var(--down-d)!important;background:#fbe5e0!important}
.mi .tag{float:right;font:700 12px var(--mono);color:var(--muted)}

/* red flags */
.chat{background:#e9e2d4;border-radius:18px;padding:14px;margin:0 0 12px}
.chat-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#4c5a51;margin:0 0 10px}
.chat-head i{width:30px;height:30px;border-radius:50%;background:#8a9a90;display:grid;place-items:center;color:#fff;font-style:normal}
.msg{background:#fff;border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:16px;line-height:1.9;color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.08)}
.ph{border-radius:6px;padding:2px 4px;cursor:pointer;border-bottom:2px dotted #b9ad97;transition:background .15s}
.ph:hover{background:#fbf3df}
.ph.on{background:#ffd9d1;border-bottom-color:var(--down-d);color:#8a2d1e}
.ph.ok{background:#e3f1e6;border-bottom-color:var(--up-d)}
.ph.miss{outline:2px dashed var(--down-d)}
.msg time{display:block;text-align:right;font-size:11px;color:var(--muted);line-height:1}

.lock{margin-top:4px}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .4s cubic-bezier(.2,.9,.3,1.05)}
.sheet.show{transform:none}
.sheet .wrap{padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet-in{background:#fff;color:var(--ink);border-radius:24px 24px 0 0;padding:18px 20px 16px;box-shadow:0 -20px 60px rgba(0,0,0,.45);border-top:6px solid var(--up-d)}
.sheet-in.bad{border-top-color:var(--down-d)}
.sheet-in.part{border-top-color:var(--gold)}
.verdict{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.verdict h3{font-size:22px;color:var(--up-d)}
.sheet-in.bad .verdict h3{color:var(--down-d)}.sheet-in.part .verdict h3{color:var(--gold)}
.verdict .gain{margin-left:auto;font:700 15px var(--mono);color:var(--up-d)}
.sheet-in.bad .gain{color:var(--down-d)}
.sheet p{margin:0 0 12px;font-size:15px;color:#3d4a42}
.sheet-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.see{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--green-2);text-decoration:none;border:1px solid #d8e6d5;background:#f3f8f0;border-radius:999px;padding:9px 14px}

/* round break */
.rbreak{text-align:center;padding:40px 0 60px}
.bell{width:110px;height:110px;margin:0 auto 18px;transform-origin:50% 10%;animation:ring 1s ease-in-out 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(9deg)}80%{transform:rotate(-5deg)}}
.rbreak .rnd{display:block;margin:0 0 10px}
.rbreak h2{font-size:clamp(34px,7vw,52px);color:#fff;line-height:1.05}
.rbreak p{color:var(--soft);font-size:17px;margin:10px auto 22px;max-width:460px}
.say{display:inline-flex;align-items:center;gap:10px;margin:0 0 24px}
.say img{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold-2)}
.say span{background:var(--gold-3);color:#12301f;border-radius:16px 16px 16px 4px;padding:8px 14px;font-weight:700;font-size:14px}
.mini-score{display:inline-flex;gap:18px;font:700 14px var(--mono);color:var(--soft);margin:0 0 22px}
.mini-score b{color:#fff;font-size:20px;display:block}

/* banner */
.toast{position:fixed;left:50%;top:96px;z-index:30;transform:translate(-50%,-30px);opacity:0;background:linear-gradient(135deg,var(--gold-3),var(--gold-2));color:#12301f;font:800 16px var(--sans);letter-spacing:.04em;padding:10px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;transition:all .35s cubic-bezier(.2,.9,.3,1.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bear{background:linear-gradient(135deg,#ffb4a6,var(--down));color:#3a0d05}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.flash{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0}
.flash.g{animation:fl .6s;background:radial-gradient(circle at 50% 60%,rgba(62,207,126,.28),transparent 60%)}
.flash.r{animation:fl .6s;background:radial-gradient(circle at 50% 60%,rgba(239,106,85,.3),transparent 60%)}
@keyframes fl{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* result */
.calc{text-align:center;padding:70px 0}
.calc h2{color:#fff;font-size:28px;margin:16px 0 6px}
.calc p{color:var(--soft);margin:0}
.calc svg{width:240px;height:110px}
.res{padding:20px 0 30px}
.persona{position:relative;border-radius:28px;padding:26px 22px;text-align:center;overflow:hidden;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:flipin .9s cubic-bezier(.2,.9,.3,1.15) both;transform-style:preserve-3d}
@keyframes flipin{from{transform:perspective(900px) rotateY(80deg) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* ---------------- charts ---------------- */
function candlesFrom(closes) {
  let prev = closes[0] - 2;
  return closes.map((c, i) => { const o = prev; prev = c; return [o, Math.max(o, c) + 1 + ((i * 7) % 3) * 0.6, Math.min(o, c) - 1 - ((i * 5) % 3) * 0.6, c]; });
}
const CHARTS = {
  flag: { closes: [100, 101, 99, 102, 108, 115, 123, 131, 139, 137, 135.5, 134.5, 133, 132, 133.5, 145, 151] },
  box: { closes: [84, 88, 93, 99, 106, 103, 110, 104, 108.5, 102.5, 109, 105, 110, 103.5, 107, 121, 125, 129, 132], box: [102, 111.6], brk: 15 },
};
function chartSVG(key) {
  const ch = CHARTS[key], cs = candlesFrom(ch.closes), n = cs.length, W = 360, H = 190, pad = 12;
  const lo = Math.min(...cs.map((x) => x[2])) - 2, hi = Math.max(...cs.map((x) => x[1])) + 2;
  const y = (v) => pad + (H - 2 * pad) * (1 - (v - lo) / (hi - lo));
  const step = (W - 20) / n, bw = step * 0.56;
  let out = '';
  if (ch.box) out += ch.box.map((v) => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#d9b878" stroke-width="1.2" stroke-dasharray="5 5" opacity=".7"/>`).join('');
  cs.forEach(([o, h, l, c], i) => {
    const x = 10 + i * step + step / 2, up = c >= o, col = up ? '#3ecf7e' : '#ef6a55';
    out += `<g class="hit" data-i="${i}"><rect class="hl" x="${x - step / 2}" y="0" width="${step}" height="${H}" rx="4"/><g class="cdl" style="animation-delay:${(i * 0.05).toFixed(2)}s"><line x1="${x}" x2="${x}" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="1.6"/><rect x="${x - bw / 2}" y="${y(Math.max(o, c))}" width="${bw}" height="${Math.max(2.5, Math.abs(y(o) - y(c)))}" rx="1.5" fill="${col}"/></g></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Price chart">${out}</svg>`;
}

  c.strokeStyle = 'rgba(217,184,120,.7)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(200, 978); c.lineTo(520, 978); c.stroke();
  c.font = '700 17px system-ui, sans-serif'; c.fillStyle = 'rgba(233,220,195,.75)'; c.fillText('FOUNDER, STREET KA DALAL', 360, 1006);
  c.font = '700 30px "JetBrains Mono", monospace'; c.fillStyle = '#fff'; c.fillText(new Date(res.at).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }), W - 360, 958);
  c.beginPath(); c.moveTo(W - 520, 978); c.lineTo(W - 200, 978); c.stroke();
  c.font = '700 17px system-ui, sans-serif'; c.fillStyle = 'rgba(233,220,195,.75)'; c.fillText('DATE', W - 360, 1006);
  seal(c, W / 2, 950, 92, lv);
  c.font = '600 16px system-ui, sans-serif'; c.fillStyle = 'rgba(233,220,195,.5)';

}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function spaced(c, s, x, y, sp) {
  const al = c.textAlign; const w = [...s].reduce((t, ch) => t + c.measureText(ch).width + sp, -sp);
  let cx = x - w / 2; c.textAlign = 'left';
  [...s].forEach((ch) => { c.fillText(ch, cx, y); cx += c.measureText(ch).width + sp; });
  c.textAlign = al;
}
function seal(c, x, y, r, lv) {
  c.save(); c.translate(x, y);
  for (let i = 0; i < 40; i++) { c.rotate(Math.PI / 20); c.fillStyle = '#b08d57'; c.beginPath(); c.moveTo(r, 0); c.lineTo(r - 12, 7); c.lineTo(r - 12, -7); c.closePath(); c.fill(); }
  const g = c.createRadialGradient(-20, -30, 10, 0, 0, r); g.addColorStop(0, '#fbe9bd'); g.addColorStop(0.55, '#d9b878'); g.addColorStop(1, '#8a6a2e');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r - 8, 0, 7); c.fill();
  c.strokeStyle = 'rgba(18,48,31,.55)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r - 20, 0, 7); c.stroke(); c.beginPath(); c.arc(0, 0, r - 46, 0, 7); c.stroke();
  const txt = 'STREET KA DALAL  ·  PROUD INVESTOR  ·  ';
  c.font = '800 13px system-ui, sans-serif'; c.fillStyle = '#12301f'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const step = (Math.PI * 2) / txt.length;
  [...txt].forEach((ch, i) => { c.save(); c.rotate(i * step - Math.PI / 2 + 0.05); c.translate(0, -(r - 33)); c.fillText(ch, 0, 0); c.restore(); });
  c.font = '700 30px Fraunces, Georgia, serif'; c.fillText('SKD', 0, -4);
  c.font = '800 12px system-ui, sans-serif'; c.fillText(String(new Date().getFullYear()), 0, 22);
  const stars = { beginner: 1, intermediate: 2, advanced: 3 }[lv.key];
  for (let i = 0; i < stars; i++) { c.save(); c.translate((i - (stars - 1) / 2) * 14, -30); c.scale(0.45, 0.45); c.beginPath(); c.moveTo(0, -12); [[3.5, -3.8], [12, -3.7], [5.2, 1.5], [7.4, 10], [0, 5], [-7.4, 10], [-5.2, 1.5], [-12, -3.7], [-3.5, -3.8]].forEach(([a, b]) => c.lineTo(a, b)); c.closePath(); c.fill(); c.restore(); }
  c.restore(); c.textBaseline = 'alphabetic';
}

fetch('data/market.json').then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status)))).then((m) => {

  const pct = (n) => (n == null || isNaN(n) ? '' : `${n > 0 ? '+' : ''}${Number(n).toFixed(2)}%`);
  const items = [...(m.indices || []).map((i) => [names[i.name] || i.name, Number(i.last || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }), i.returns?.['1D']]), ...(m.sectoral || []).filter((s) => s.returns?.['1D'] != null).slice(0, 12).map((s) => [s.name.replace(/^NIFTY /i, 'Nifty '), '', s.returns['1D']])];
  const html = items.map(([n, v, c]) => `<span>${esc(n)} ${v ? `<b>${v}</b>` : ''} <em class="${c > 0 ? 'up' : c < 0 ? 'down' : ''}" style="font-style:normal">${pct(c)}</em></span>`).join('') + '<span><b>INVESTOR PERSONA TEST</b> 16 moves · 3 rounds · 1 certificate</span>';
  $('#ticker').innerHTML = html + html;
}).catch(() => { $('#ticker').innerHTML = '<span><b>INVESTOR PERSONA TEST</b> 16 moves · 3 rounds · 1 certificate</span>'.repeat(10); });
